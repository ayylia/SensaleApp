<svg width="350" height="480" viewBox="0 0 350 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TIER 1: Presentation Layer -->
  <rect x="25" y="20" width="300" height="110" stroke="#000000" stroke-width="2" fill="#FFFFFF" />
  <text x="175" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 1: Presentation Layer</text>
  
  <rect x="75" y="55" width="200" height="30" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" />
  <text x="175" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">User Interface / PWA</text>
  
  <rect x="45" y="93" width="120" height="25" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" />
  <text x="105" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Visualization Charts</text>
  
  <rect x="185" y="93" width="120" height="25" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" />
  <text x="245" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">HTTP Client</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M175 130 V160" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- TIER 2: Application Layer -->
  <rect x="25" y="160" width="300" height="170" stroke="#000000" stroke-width="2" fill="#FFFFFF" />
  <text x="175" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 2: Application Layer</text>
  
  <rect x="75" y="195" width="200" height="28" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" />
  <text x="175" y="214" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">API Controller</text>
  
  <rect x="55" y="233" width="240" height="55" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" stroke-dasharray="3 3" />
  <rect x="75" y="240" width="200" height="20" stroke="#000000" stroke-width="1" fill="#FFFFFF" />
  <text x="175" y="254" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Holt-Winters Algorithm</text>
  <rect x="75" y="263" width="200" height="20" stroke="#000000" stroke-width="1" fill="#FFFFFF" />
  <text x="175" y="277" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Linear Regression Model</text>
  
  <rect x="75" y="297" width="200" height="25" stroke="#000000" stroke-width="1.5" fill="#FFFFFF" />
  <text x="175" y="314" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Gemini AI Copilot Module</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M175 330 V360" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- TIER 3: Data Layer -->
  <rect x="25" y="360" width="300" height="100" stroke="#000000" stroke-width="2" fill="#FFFFFF" />
  <text x="175" y="382" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 3: Data Layer</text>
  
  <rect x="45" y="398" width="120" height="45" stroke="#000000" stroke-width="1.5" rx="5" fill="#FFFFFF" />
  <text x="105" y="424" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">SQL Database</text>

  <rect x="185" y="398" width="120" height="45" stroke="#000000" stroke-width="1.5" rx="5" fill="#FFFFFF" />
  <text x="245" y="424" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Sales &amp; User Data</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#000000" />
    </marker>
  </defs>
</svg>
